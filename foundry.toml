[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Execution spec for Forge's EVM, so script simulations accept EIP-7702 (type-0x04) transactions.
# solc's own target stays clamped to what 0.8.24 supports, so bytecode is unaffected.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# See https://book.getfoundry.sh/reference/config/overview for more options.
